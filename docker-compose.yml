services:
  waf-monitor:
    build: .
    container_name: waf-monitor
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - waf-monitor-data:/data
      - /var/log/nginx/backend/access_api.log:/var/log/nginx/backend/access_api.log:ro
    # AWS credentials: use one of the options below
    # environment:
    #   AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    #   AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    # Or mount ~/.aws for EC2 profile-based auth:
    # volumes:
    #   - waf-monitor-data:/data
    #   - ~/.aws:/home/appuser/.aws:ro

volumes:
  waf-monitor-data:
